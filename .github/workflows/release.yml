name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Resolve tag: prefer workflow_dispatch input, fall back to pushed tag
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build-web:
    name: Build web assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload web assets
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/

  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macosx_11_0_arm64
          - target: x86_64-apple-darwin
            os: macos-13
            platform: macosx_10_12_x86_64

          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: manylinux_2_17_x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: manylinux_2_17_aarch64

          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win_amd64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download web assets
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} --package rv_cli --features embed-assets
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload CLI binary (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/rileyviewer

      - name: Upload CLI binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/rileyviewer.exe

  build-python:
    name: Build Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        working-directory: python
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-python
    environment: pypi
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-cli, publish]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all CLI binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: binaries/

      - name: Prepare release assets
        run: |
          mkdir release-assets
          # Package each binary with platform name
          for dir in binaries/cli-*/; do
            platform=$(basename "$dir" | sed 's/cli-//')
            if [[ -f "$dir/rileyviewer.exe" ]]; then
              zip -j "release-assets/rileyviewer-$platform.zip" "$dir/rileyviewer.exe"
            else
              tar -czvf "release-assets/rileyviewer-$platform.tar.gz" -C "$dir" rileyviewer
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          generate_release_notes: true
