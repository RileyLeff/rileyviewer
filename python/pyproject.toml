[project]
name = "rileyviewer"
version = "0.1.0"
description = "Plot viewer for Python with persistent browser-based UI"
readme = "README.md"
authors = [
    { name = "RileyLeff", email = "rileyleff@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
tables = ["pyarrow>=14.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/rileyleff/rileyviewer"
Repository = "https://github.com/rileyleff/rileyviewer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rileyviewer"]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "websockets>=12.0",
]
